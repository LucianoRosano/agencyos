name: Deploy producción

# Se dispara al crear un tag vX.Y.Z (Claude lo propone, Luciano lo aprueba).
# El job usa el environment "production", que exige aprobación manual de Luciano
# (Settings → Environments → production → Required reviewers).
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: ¿Hay VPS configurado?
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::El tag '$TAG' no es vX.Y.Z"; exit 1
          fi
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy producción salteado::Faltan los secrets VPS_HOST, VPS_USER y/o VPS_SSH_KEY. Ver docs/DEPLOYMENT.md."
          fi

  deploy:
    name: Deploy a producción
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
    steps:
      - name: Preparar SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::Sin VPS_KNOWN_HOSTS: se confía en la huella del primer contacto (cargalo para fijarla)."
            ssh-keyscan -p "${VPS_PORT:-22}" -t ed25519 "$VPS_HOST" > ~/.ssh/known_hosts
          fi
      - name: Deploy (backup previo + migraciones + health check + rollback automático)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          TAG: ${{ github.ref_name }}
        run: ssh -p "${VPS_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$VPS_USER@$VPS_HOST" "deploy prod $TAG"
      - name: Limpiar clave
        if: always()
        run: rm -f ~/.ssh/id_ed25519
