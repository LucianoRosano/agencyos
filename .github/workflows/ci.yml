name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TZ: America/Buenos_Aires
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint-typecheck:
    name: Lint y typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # versión desde "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Unit + integración (Postgres 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: agencyos
          POSTGRES_DB: agencyos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agencyos -d agencyos_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://agencyos:agencyos@127.0.0.1:5432/agencyos_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    name: E2E (Playwright, 1440 y 390 oscuro)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: agencyos
          POSTGRES_DB: agencyos_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agencyos -d agencyos_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: "true"
      E2E_DATABASE_URL: postgres://agencyos:agencyos@127.0.0.1:5432/agencyos_e2e
      # Token de prueba para /setup (solo CI; el webServer de Playwright lo recibe).
      SETUP_TOKEN: e2e-setup-token-solo-ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versión de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Caché de navegadores
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Instalar Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Dependencias del sistema (con caché)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: E2E
        run: pnpm e2e --project desktop-1440-dark --project mobile-390-dark
      - name: Subir reporte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Subir capturas y trazas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: capturas-e2e
          path: |
            docs/capturas/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  gitleaks:
    name: Secretos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Solo hace falta si el repo pasa a una organización: GITLEAKS_LICENSE.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  audit:
    name: Dependencias (pnpm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Bloquea solo HIGH/CRITICAL con versión parcheada publicada; sin fix = aviso (ver docs/TESTING.md).
      - name: pnpm audit --audit-level=high
        run: |
          set +e
          pnpm audit --audit-level=high --json > audit.json
          set -e
          node infra/scripts/ci/audit-gate.mjs < audit.json
