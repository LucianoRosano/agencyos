<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171411">
<title>Sin conexión · AGENCYOS</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Inter;src:url(/fonts/Inter-Variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#171411;--surface:#221D18;--border:rgba(255,240,220,.09);--text:#EEE7DD;--muted:#ABA194;--dot:transparent;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#F7F4EE;--surface:#fff;--border:rgba(41,32,22,.12);--text:#1F1A15;--muted:#5F574D;--dot:transparent;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg) radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;text-align:center;-webkit-font-smoothing:antialiased}
main{max-width:420px}
.logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:40px;font:600 14px/1 ui-monospace,monospace;letter-spacing:.32em}
.os{background:#A9471F;-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font:12px/1 ui-monospace,monospace;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:12px 0 0}
p.lead{color:var(--muted);font-size:15px;line-height:1.6;margin:12px 0 0}
button{margin-top:28px;min-height:44px;padding:0 22px;border-radius:8px;border:0;color:#fff;background:#A9471F;font:500 15px Inter,system-ui,sans-serif;cursor:pointer}
button:focus-visible{outline:2px solid #A9471F;outline-offset:2px}
.hint{margin-top:20px;font-size:13px;color:var(--muted)}
form{margin-top:36px;padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-align:left}
label{display:block;font:12px/1 ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
textarea{width:100%;min-height:96px;resize:vertical;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,sans-serif}
textarea:focus-visible{outline:2px solid #A9471F;outline-offset:1px}
form button{margin-top:12px;width:100%}
</style>
</head>
<body>
<main>
  <div class="logo" aria-label="AGENCYOS">
    <svg width="28" height="28" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A9471F"/><stop offset="1" stop-color="#7A4E7E"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="#171411"/><rect x="96" y="96" width="320" height="320" rx="72" fill="none" stroke="url(#g)" stroke-width="28"/><rect x="196" y="196" width="120" height="120" rx="30" fill="url(#g)"/></svg>
    <span>AGENCY<span class="os">OS</span></span>
  </div>
  <p class="eyebrow">Sin conexión</p>
  <h1>No hay internet ahora</h1>
  <p class="lead">AGENCYOS muestra siempre tus datos actualizados, así que necesita conexión.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
  <p class="hint">Se reintenta solo cuando vuelva la conexión.</p>
  <form id="cap">
    <label for="cap-text">Capturar igual</label>
    <textarea id="cap-text" required placeholder="Una tarea, una idea, un gasto, un link…"></textarea>
    <button type="submit">Guardar en este dispositivo</button>
    <p id="cap-msg" class="hint" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
addEventListener("online",()=> {location.reload()});
(()=> {
  var KEY="agencyos:capturas-pendientes",f=document.getElementById("cap"),t=document.getElementById("cap-text"),m=document.getElementById("cap-msg");
  function list(){var v;try{v=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){v=[]}return Array.isArray(v)?v:[]}
  function show(){var n=list().length;m.textContent=n?(n===1?"1 captura":n+" capturas")+" esperando conexión: se suben solas a la Bandeja.":""}
  f.addEventListener("submit",(e)=> {e.preventDefault();var x=t.value.trim();if(!x)return;var l=list();l.push({text:x.slice(0,5000),at:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(l.slice(-200)));t.value="";show();t.focus()});
  show();
})();
</script>
</body>
</html>
